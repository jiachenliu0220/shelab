<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>开始使用 - 打工人启动助手</title>
    <meta name="description" content="开始你的温柔启动之旅，每天10分钟，开启美好的一天。">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>">
</head>
<body class="app-page">
    <!-- 应用导航栏 -->
    <nav class="app-navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <a href="index.html">
                    <span class="brand-icon">🌸</span>
                    <span class="brand-text">打工人启动助手</span>
                </a>
            </div>
            <div class="nav-actions">
                <button id="settings-btn" class="settings-btn" title="设置">
                    <span class="settings-icon">⚙️</span>
                </button>
            </div>
        </div>
    </nav>

    <div id="app">
        <!-- 主聊天界面 -->
        <div id="chat-container" class="chat-container">
            <main class="chat-main">
                <div id="chat-messages" class="chat-messages">
                    <div class="welcome-message">
                        <div class="message bot-message">
                            <div class="message-avatar">🦊</div>
                            <div class="message-content">
                                <p>你好！我是你的温柔启动助手 🌸</p>
                                <p>我可以帮你：</p>
                                <ul>
                                    <li>🌅 每日温柔启动</li>
                                    <li>💚 个性化Self-care推荐</li>
                                    <li>🐾 陪伴你的小动物成长</li>
                                    <li>📝 记录你的美好时光</li>
                                </ul>
                                <p>想要开始今天的启动吗？</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="chat-input-container">
                    <div class="input-wrapper">
                        <input 
                            type="text" 
                            id="message-input" 
                            class="message-input" 
                            placeholder="告诉我你想要什么帮助..."
                            maxlength="500"
                        >
                        <button id="send-btn" class="send-btn" title="发送">
                            <span class="send-icon">💌</span>
                        </button>
                    </div>
                    <div class="input-hint">
                        💡 试试说："我想开始今天的启动" 或 "帮我选择今天的self-care"
                    </div>
                </div>
            </main>
        </div>

        <!-- 设置面板 -->
        <div id="settings-panel" class="settings-panel hidden">
            <div class="settings-content">
                <div class="settings-header">
                    <h2>⚙️ 设置</h2>
                    <button id="close-settings" class="close-btn">×</button>
                </div>

                <div class="settings-body">
                    <div class="settings-section">
                        <h3>🔗 API 配置</h3>
                        <div class="form-group">
                            <label for="api-url">API 地址</label>
                            <input 
                                type="url" 
                                id="api-url" 
                                class="form-input"
                                placeholder="https://api.example.com/v1/chat"
                            >
                        </div>
                        
                        <div class="form-group">
                            <label for="api-key">API 密钥</label>
                            <input 
                                type="password" 
                                id="api-key" 
                                class="form-input"
                                placeholder="sk-..."
                            >
                        </div>
                        
                        <div class="form-group">
                            <label for="model-name">模型名称</label>
                            <input 
                                type="text" 
                                id="model-name" 
                                class="form-input"
                                placeholder="gpt-3.5-turbo"
                            >
                        </div>
                    </div>

                    <div class="settings-section">
                        <h3>🎨 界面设置</h3>
                        <div class="form-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="cute-mode" checked>
                                <span class="checkbox-custom"></span>
                                可爱模式
                            </label>
                        </div>
                        
                        <div class="form-group">
                            <label for="theme-select">主题色彩</label>
                            <select id="theme-select" class="form-select">
                                <option value="pink">粉色系 🌸</option>
                                <option value="green">绿色系 🌿</option>
                                <option value="blue">蓝色系 💙</option>
                                <option value="purple">紫色系 💜</option>
                            </select>
                        </div>
                    </div>

                    <div class="settings-section">
                        <h3>📊 数据管理</h3>
                        <div class="form-group">
                            <button id="export-data" class="btn-secondary">
                                📤 导出数据
                            </button>
                            <button id="clear-data" class="btn-danger">
                                🗑️ 清除数据
                            </button>
                        </div>
                    </div>
                </div>

                <div class="settings-footer">
                    <button id="save-settings" class="btn-primary">
                        💾 保存配置
                    </button>
                </div>
            </div>
        </div>

        <!-- 加载指示器 -->
        <div id="loading-indicator" class="loading-indicator hidden">
            <div class="loading-spinner">🌸</div>
            <p>正在思考中...</p>
        </div>
    </div>

    <!-- JavaScript 文件 -->
    <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/api-client.js"></script>
    <script src="js/chat-manager.js"></script>
    <script src="js/settings-manager.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
